<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Ticket - People's Party of India</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="ticket-wrapper">
    <!-- Ticket Card -->
    <div class="ticket-card" id="ticketCard">
      <div class="ticket-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Ashoka_Chakra.svg/1200px-Ashoka_Chakra.svg.png" alt="Party Logo" class="ticket-logo">
        <h2>People's Party of India</h2>
        <p style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">Official Membership Identity</p>
      </div>
      
      <div class="ticket-body">
        <div class="ticket-id">
          <span>Member ID</span>
          <strong id="tId">Loading...</strong>
        </div>

        <div class="ticket-row">
          <div class="ticket-label">Full Name</div>
          <div class="ticket-val" id="tName">—</div>
        </div>

        <div class="ticket-row" style="display:flex; gap:20px;">
          <div style="flex:1;">
            <div class="ticket-label">Father/Husband</div>
            <div class="ticket-val" id="tFather">—</div>
          </div>
          <div style="flex:1;">
            <div class="ticket-label">Phone</div>
            <div class="ticket-val" id="tPhone">—</div>
          </div>
        </div>

        <div class="ticket-row" style="display:flex; gap:20px;">
          <div style="flex:1;">
            <div class="ticket-label">District</div>
            <div class="ticket-val" id="tDistrict">—</div>
          </div>
          <div style="flex:1;">
            <div class="ticket-label">Assembly</div>
            <div class="ticket-val" id="tAssembly">—</div>
          </div>
        </div>
      </div>

      <div class="ticket-footer">
        Issued on <span id="tDate">—</span><br>
        Valid across all regional chapters in Tamil Nadu.
      </div>
    </div>

    <!-- Actions -->
    <div class="ticket-actions">
      <button class="btn-submit" onclick="window.print()" style="margin-top:0; width:auto; padding:12px 24px;">
        🖨️ Print Ticket
      </button>
      <a href="index.html" class="btn-outline">Register Another</a>
    </div>
  </div>

  <script>
    // ─── SECURITY: DISABLE RIGHT-CLICK & INSPECT ──────────
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || 
         (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
         (e.ctrlKey && ['U','u'].includes(e.key))) {
        e.preventDefault();
      }
    });

    window.onload = function() {
      const dataStr = sessionStorage.getItem('newMemberTicket');
      if (!dataStr) {
        alert("No membership data found. Please register first.");
        window.location.href = 'index.html';
        return;
      }

      try {
        const data = JSON.parse(dataStr);
        document.getElementById('tId').textContent = data.memberId || '—';
        document.getElementById('tName').textContent = data.name || '—';
        document.getElementById('tFather').textContent = data.fatherName || '—';
        document.getElementById('tPhone').textContent = data.phone || '—';
        document.getElementById('tDistrict').textContent = data.district || '—';
        document.getElementById('tAssembly').textContent = data.assembly || '—';
        document.getElementById('tDate').textContent = new Date().toLocaleDateString('en-IN', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      } catch (err) {
        console.error(err);
      }
    };
  </script>

</body>
</html>
