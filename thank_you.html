<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — People's Party</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .thank-you-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
      padding: 20px;
    }
    .thank-you-card {
      background: var(--card-bg, #ffffff);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .thank-you-card h2 {
      margin-bottom: 15px;
      color: var(--text-color, #333);
    }
    .thank-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .btn-back {
      display: inline-block;
      padding: 10px 20px;
      background: #f0f0f0;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-back:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div style="width:52px;height:52px;background:linear-gradient(135deg,#FF6B00,#006B3C);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;">🏛️</div>
    <div class="header-title">
      <h1>People's Party of India</h1>
      <p>Membership Registration Portal</p>
    </div>
  </div>
</header>

<div class="thank-you-wrapper">
  <div class="thank-you-card">
    <div class="thank-icon">🙏</div>
    <h2>Thank You!</h2>
    <p>We appreciate your time. Have a great day!</p>
    <a href="entry.html" class="btn-back">← Go Back</a>
  </div>
</div>
</body>
</html>
