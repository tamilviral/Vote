<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — People's Party</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="admin-login-wrapper">
  <div class="admin-login-card">
    <div class="admin-login-title">
      <span class="lock-icon">🔐</span>
      <h2>Admin Panel</h2>
      <p>Sign in to manage member registrations</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="field" style="margin-bottom:16px;">
        <label for="adminUser">Username <span class="req">*</span></label>
        <input type="text" id="adminUser" placeholder="Enter admin username" autocomplete="username"/>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="adminPass">Password <span class="req">*</span></label>
        <input type="password" id="adminPass" placeholder="Enter password" autocomplete="current-password"/>
      </div>
      <div class="field-error" id="loginError" style="margin-bottom:12px;font-size:0.82rem;">Invalid credentials. Please try again.</div>
      <button type="submit" class="btn-login" id="loginBtn">Login to Dashboard</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.75rem;color:var(--text-muted);">
      <a href="../index.html" style="color:var(--saffron);text-decoration:none;">← Back to Registration</a>
    </p>
  </div>
</div>

<script type="module">
  // ─── SECURITY: DISABLE RIGHT-CLICK & INSPECT ──────────
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12' || 
       (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
       (e.ctrlKey && ['U','u'].includes(e.key))) {
      e.preventDefault();
    }
  });

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ─── FIREBASE CONFIG (Obfuscated) ────────────────────
  const firebaseConfig = {
    apiKey: atob("QUl6YVN5QlYzemlySDh2dlhiWl9tekFDRlRGRHFmV1pOZzlnYUI0"),
    authDomain: atob("dm90ZS01MmYyZS5maXJlYmFzZWFwcC5jb20="),
    databaseURL: atob("aHR0cHM6Ly92b3RlLTUyZjJlLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
    projectId: atob("dm90ZS01MmYyZQ=="),
    storageBucket: atob("dm90ZS01MmYyZS5maXJlYmFzZXN0b3JhZ2UuYXBw"),
    messagingSenderId: atob("MTA3OTk0NjYxNDMzNw=="),
    appId: atob("MToxMDc5OTQ2NjE0MzM3OndlYjo2OTMxMzdiNjZlYzJjYmVmMGE5OGMw")
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ─── CRYPTO (SHA-256) ───────────────────────────────────
  async function hashString(str) {
    const data = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Default Fallback Hashes (SHA-256 for admin / party@123)
  const _cHash = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
  const _pHash = '9d86333c1620aeb95315354be22394fccfcdb8243be7a4bb7f55b1f86cd29a43';

  if (sessionStorage.getItem('adminAuth') === 'true') {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (!u || !p) {
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    btn.textContent = 'Verifying...';
    btn.disabled = true;

    try {
      // Hash entered credentials
      const uHash = await hashString(u);
      const pHash = await hashString(p);

      // Check custom password in Firestore
      const adminDoc = await getDoc(doc(db, 'settings', 'admin'));
      let valid = false;

      if (adminDoc.exists()) {
        const data = adminDoc.data();
        if (data.username === uHash && data.password === pHash) valid = true;
      } else {
        // Fallback to default if no custom password is set
        if (uHash === _cHash && pHash === _pHash) valid = true;
      }

      if (valid) {
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errEl.classList.add('show');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
        btn.textContent = 'Login to Dashboard';
        btn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      errEl.textContent = 'Connection error. Please try again.';
      errEl.classList.add('show');
      btn.textContent = 'Login to Dashboard';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
